<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | COREBOUND</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            color: #111;

            background:
                linear-gradient(
                    rgba(235, 243, 245, 0.78),
                    rgba(235, 243, 245, 0.00)
                ),
                url(
                    "{{ url_for(
                        'static',
                        filename='images/campus-background.jpg'
                    ) }}"
                )
                center center / cover
                no-repeat fixed;
        }


        /* ==================================================
           PAGE CONTAINER
           ================================================== */

        .page-shell {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 35px 20px;
        }


        /* ==================================================
           LOGIN CARD
           Same general size/style as register card
           ================================================== */

        .login-card {

            width: 100%;

            max-width: 750px;

            background: #fff;

            border-radius: 20px;

            padding: 30px 40px 40px;

            box-shadow:
                20px 20px 35px
                rgba(0, 0, 0, 0.25);
        }


        /* ==================================================
           HEADER
           ================================================== */

        .login-header {

            margin-bottom: 25px;
        }


        .login-header h1 {

            margin: 0;

            font-size: 32px;

            line-height: 1.1;

            font-weight: bold;
        }


        .login-header p {

            margin: 8px 0 0;

            font-size: 16px;

            color: #2b6a8b;
        }


        /* ==================================================
           FLASK MESSAGE
           ================================================== */

        .form-message {

            margin-bottom: 15px;

            padding: 10px 12px;

            border-radius: 7px;

            font-family:
                Arial,
                sans-serif;

            font-size: 13px;

            line-height: 1.4;
        }


        .form-message.error {

            background: #fff0f0;

            border:
                1px solid #e1a1a1;

            color: #a32121;
        }


        .form-message.success {

            background: #eef9f0;

            border:
                1px solid #9aca9e;

            color: #22652c;
        }


        /* ==================================================
           FORM
           ================================================== */

        .login-form {

            width: 100%;
        }


        .field {

            margin-bottom: 18px;
        }


        .field label {

            display: block;

            margin-bottom: 6px;

            font-size: 16px;

            font-weight: bold;
        }


        .field input {

            width: 100%;

            height: 45px;

            padding: 0 13px;

            border:
                1px solid #999;

            border-radius: 8px;

            background: #fff;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 15px;

            outline: none;
        }


        .field input:focus {

            border-color: #0877b5;

            box-shadow:
                0 0 0 2px
                rgba(8, 119, 181, 0.15);
        }


        .field input::placeholder {

            color: #b0b0b0;
        }


        /* ==================================================
           PASSWORD
           ================================================== */

        .password-wrap {

            position: relative;
        }


        .password-wrap input {

            padding-right: 50px;
        }


        .password-toggle {

            position: absolute;

            top: 50%;

            right: 7px;

            transform:
                translateY(-50%);

            width: 35px;

            height: 35px;

            border: none;

            background: transparent;

            cursor: pointer;

            color: #333;

            font-size: 19px;
        }


        .password-toggle:hover {

            opacity: 0.7;
        }


        /* ==================================================
           LOGIN OPTIONS
           ================================================== */

        .login-options {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-top: -3px;

            margin-bottom: 18px;

            font-family:
                Arial,
                sans-serif;

            font-size: 13px;
        }


        .remember-container {

            display: flex;

            align-items: center;

            gap: 7px;

            cursor: pointer;
        }


        .remember-container input {

            width: 16px;

            height: 16px;

            cursor: pointer;
        }


        .forgot-password {

            color: #0066b3;

            text-decoration: none;
        }


        .forgot-password:hover {

            text-decoration: underline;
        }


        /* ==================================================
           CAPTCHA
           ================================================== */

        .captcha-box {

            width: 100%;

            height: 45px;

            padding:
                0 15px;

            border:
                1px solid #999;

            border-radius: 8px;

            background: #fff;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            margin-bottom: 4px;
        }


        .captcha-label {

            display: flex;

            align-items: center;

            gap: 12px;

            cursor: pointer;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 16px;

            font-weight: bold;
        }


        .captcha-label input {

            width: 22px;

            height: 22px;

            cursor: pointer;
        }


        .captcha-mark {

            font-size: 22px;

            color: #4285f4;
        }


        .captcha-error {

            display: block;

            margin-top: 4px;

            margin-bottom: 5px;

            font-family:
                Arial,
                sans-serif;

            font-size: 12px;

            color: #c62828;
        }


        /* ==================================================
           LOGIN BUTTON
           ================================================== */

        .form-actions {

            display: flex;

            flex-direction: column;

            align-items: center;

            margin-top: 20px;
        }


        .login-button {

            width: 220px;

            height: 45px;

            border: none;

            border-radius: 8px;

            background: #0066b3;

            color: #fff;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 17px;

            cursor: pointer;

            margin-bottom: 15px;

            transition:
                background 0.2s ease;
        }


        .login-button:hover {

            background: #005596;
        }


        .login-button:active {

            transform:
                translateY(1px);
        }


        .login-button:disabled {

            background: #7faec7;

            cursor: not-allowed;

            transform: none;
        }


        /* ==================================================
           REGISTER PROMPT
           ================================================== */

        .register-prompt {

            margin: 0;

            font-size: 15px;

            text-align: center;
        }


        .register-prompt a {

            color: #0066b3;

            text-decoration: none;
        }


        .register-prompt a:hover {

            text-decoration: underline;
        }


        /* ==================================================
           LOADING SPINNER
           ================================================== */

        .spinner {

            display: none;

            width: 16px;

            height: 16px;

            border:
                2px solid
                rgba(255,255,255,.5);

            border-top-color: #fff;

            border-radius: 50%;

            animation:
                spin .7s linear infinite;
        }


        .login-button.loading .spinner {

            display: inline-block;
        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);
            }
        }


        /* ==================================================
           MOBILE
           ================================================== */

        @media (max-width: 768px) {

            .login-card {

                max-width: 500px;

                padding:
                    25px 30px;
            }

        }


        @media (max-width: 500px) {

            .login-card {

                padding:
                    25px 22px 30px;
            }


            .login-header h1 {

                font-size: 28px;
            }


            .login-options {

                font-size: 12px;
            }

        }

    </style>

</head>


<body>


<main class="page-shell">


    <section
        class="login-card"
        aria-labelledby="login-title"
    >


        <!-- ==================================================
             HEADER
             ================================================== -->

        <header class="login-header">

            <h1 id="login-title">
                Login
            </h1>

            <p>
                Login to your COREBOUND account.
            </p>

        </header>


        <!-- ==================================================
             FLASK FLASH MESSAGES
             ================================================== -->

        {% with messages =
            get_flashed_messages(
                with_categories=true
            )
        %}

            {% if messages %}

                {% for category, message in messages %}

                    <div
                        class="form-message {{ category }}"
                        role="alert"
                    >
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- ==================================================
             LOGIN FORM
             ================================================== -->

        <form
            id="loginForm"
            class="login-form"
            method="POST"
            action="{{ url_for('login') }}"
        >


            <!-- USERNAME -->

            <div class="field">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your Username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-wrap">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your Password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Show password"
                    >
                        ⊘
                    </button>

                </div>

            </div>


            <!-- REMEMBER ME / FORGOT PASSWORD -->

            <div class="login-options">

                <label
                    class="remember-container"
                    for="rememberMe"
                >

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    <span>
                        Remember Me
                    </span>

                </label>


                <a
                    href="#"
                    class="forgot-password"
                    id="forgotPassword"
                >
                    Forgot Password?
                </a>

            </div>


            <!-- CAPTCHA -->

            <div class="captcha-box">

                <label class="captcha-label">

                    <input
                        type="checkbox"
                        id="captcha"
                        name="captcha"
                        value="verified"
                    >

                    <span>
                        I'm not a robot
                    </span>

                </label>


                <span class="captcha-mark">
                    🔄
                </span>

            </div>


            <small
                class="captcha-error"
                id="captchaError"
            ></small>


            <!-- LOGIN BUTTON -->

            <div class="form-actions">

                <button
                    class="login-button"
                    id="loginButton"
                    type="submit"
                >

                    <span id="buttonText">
                        Login
                    </span>

                    <span
                        class="spinner"
                        aria-hidden="true"
                    ></span>

                </button>


                <!-- REGISTER -->

                <p class="register-prompt">

                    Don't have an account?

                    <a
                        href="{{ url_for('register') }}"
                    >
                        Register
                    </a>

                </p>

            </div>


        </form>


    </section>


</main>


<script>


document.addEventListener(
    "DOMContentLoaded",
    function () {


    /* ==================================================
       ELEMENTS
       ================================================== */


    const form =
        document.getElementById(
            "loginForm"
        );


    const username =
        document.getElementById(
            "username"
        );


    const password =
        document.getElementById(
            "password"
        );


    const passwordToggle =
        document.getElementById(
            "passwordToggle"
        );


    const captcha =
        document.getElementById(
            "captcha"
        );


    const captchaError =
        document.getElementById(
            "captchaError"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    const buttonText =
        document.getElementById(
            "buttonText"
        );


    const rememberMe =
        document.getElementById(
            "rememberMe"
        );


    const forgotPassword =
        document.getElementById(
            "forgotPassword"
        );


    /* ==================================================
       SHOW / HIDE PASSWORD
       ================================================== */

    passwordToggle.addEventListener(
        "click",
        function () {


            if (
                password.type ===
                "password"
            ) {

                password.type =
                    "text";

                passwordToggle.textContent =
                    "👁";

                passwordToggle.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            }


            else {

                password.type =
                    "password";

                passwordToggle.textContent =
                    "⊘";

                passwordToggle.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        }
    );


    /* ==================================================
       REMEMBER USERNAME
       ================================================== */

    const savedUsername =
        localStorage.getItem(
            "coreboundUsername"
        );


    if (savedUsername) {

        username.value =
            savedUsername;

        rememberMe.checked =
            true;
    }


    /* ==================================================
       LOGIN SUBMISSION
       ================================================== */

    form.addEventListener(
        "submit",
        function (event) {


            const usernameValue =
                username.value.trim();


            const passwordValue =
                password.value;


            /* ------------------------------------------
               Username validation
               ------------------------------------------ */

            if (!usernameValue) {

                event.preventDefault();

                username.focus();

                return;
            }


            /* ------------------------------------------
               Password validation
               ------------------------------------------ */

            if (!passwordValue) {

                event.preventDefault();

                password.focus();

                return;
            }


            /* ------------------------------------------
               CAPTCHA validation
               ------------------------------------------ */

            if (!captcha.checked) {

                event.preventDefault();

                captchaError.textContent =
                    "Please confirm that you are not a robot.";

                return;
            }


            captchaError.textContent =
                "";


            /* ------------------------------------------
               Remember username
               ------------------------------------------ */

            if (rememberMe.checked) {

                localStorage.setItem(
                    "coreboundUsername",
                    usernameValue
                );

            }

            else {

                localStorage.removeItem(
                    "coreboundUsername"
                );

            }


            /* ------------------------------------------
               Loading state
               ------------------------------------------ */

            loginButton.disabled =
                true;

            loginButton.classList.add(
                "loading"
            );

            buttonText.textContent =
                "Signing in...";

        }
    );


    /* ==================================================
       CLEAR CAPTCHA ERROR
       ================================================== */

    captcha.addEventListener(
        "change",
        function () {

            if (captcha.checked) {

                captchaError.textContent =
                    "";
            }

        }
    );


    /* ==================================================
       FORGOT PASSWORD
       ================================================== */

    forgotPassword.addEventListener(
        "click",
        function (event) {

            event.preventDefault();

            alert(
                "Please contact the system administrator to reset your password."
            );

        }
    );


    /* ==================================================
       CLEAR BASIC VALIDATION STATES
       ================================================== */

    username.addEventListener(
        "input",
        function () {

            username.setCustomValidity("");

        }
    );


    password.addEventListener(
        "input",
        function () {

            password.setCustomValidity("");

        }
    );


    });


</script>


</body>

</html>
